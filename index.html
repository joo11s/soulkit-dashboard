<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoulKit Office — Agent Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060f;--bg2:#0a0a16;--bg3:#111128;
  --border:#2a2a4a;--border2:#1e1e3a;
  --gold:#f5e6c8;--gold2:#f0d9a8;--gold3:#e8c87a;
  --accent:#7c3aed;--accent2:#a78bfa;
  --text:#e8e4ff;--text2:#6b6b9a;--text3:#3a3a5a;
  --idle:#3a3a5a;--running:#7c3aed;--done:#2d6a4f;--error:#7f1d1d;
  --idle-t:#a0a0c0;--running-t:#a78bfa;--done-t:#52b788;--error-t:#f87171;
}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:rgba(10,10,22,.9);
  border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:100;
  backdrop-filter:blur(12px);
}
.logo{font-size:13px;font-weight:700;letter-spacing:4px;color:var(--text)}
.logo span{color:var(--gold)}
.header-right{display:flex;align-items:center;gap:12px}
.live-badge{
  display:flex;align-items:center;gap:6px;
  padding:4px 10px;border:1px solid var(--running-t);border-radius:2px;
  font-size:9px;letter-spacing:2px;color:var(--running-t);
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--running-t);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.refresh-info{font-size:9px;color:var(--text3);letter-spacing:1px}
.last-update{font-size:9px;color:var(--text3)}

/* ── OFFICE MAP ── */
.office{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:auto auto auto;
  gap:12px;
  padding:16px;
  max-width:960px;margin:0 auto;
}
.team-room{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:4px;padding:16px;position:relative;
  transition:border-color .3s;
}
.team-room:hover{border-color:var(--border)}
.team-room.support{grid-column:1/-1}
.room-label{
  font-size:8px;letter-spacing:3px;text-transform:uppercase;
  color:var(--text3);margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.room-label::before{content:'';display:block;width:12px;height:1px;background:var(--text3)}
.agents-row{display:flex;gap:16px;flex-wrap:wrap}

/* ── AGENT CARD ── */
.agent-card{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 10px;border:1px solid var(--border2);border-radius:4px;
  background:var(--bg3);min-width:90px;flex:1;max-width:130px;
  transition:border-color .3s,background .3s;cursor:default;
  position:relative;overflow:hidden;
}
.agent-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--status-color, var(--idle));
  transition:background .3s;
}
.agent-card[data-status="RUNNING"]{--status-color:var(--running);border-color:rgba(124,58,237,.4);background:rgba(124,58,237,.06)}
.agent-card[data-status="DONE"]{--status-color:var(--done);border-color:rgba(82,183,136,.3);background:rgba(82,183,136,.04)}
.agent-card[data-status="ERROR"]{--status-color:var(--error);border-color:rgba(248,113,113,.3);background:rgba(127,29,29,.08)}
.agent-card[data-status="IDLE"]{--status-color:var(--idle)}

/* ── PIXEL CHARACTER ── */
.pixel-char{
  width:48px;height:48px;position:relative;image-rendering:pixelated;
}
.pixel-char canvas{width:48px;height:48px;image-rendering:pixelated}

/* ── CHARACTER ANIMATIONS ── */

/* IDLE: slow breathing (1px up/down) */
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.agent-card[data-status="IDLE"] .pixel-char{animation:breathe 4s ease-in-out infinite}

/* RUNNING: fast typing bounce */
@keyframes typing{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.agent-card[data-status="RUNNING"] .pixel-char{animation:typing .3s ease-in-out infinite}

/* DONE: celebrate bounce (arms raised) */
@keyframes celebrate{
  0%,100%{transform:translateY(0) scale(1)}
  40%,60%{transform:translateY(-4px) scale(1.05)}
}
.agent-card[data-status="DONE"] .pixel-char{animation:celebrate 2s ease-in-out infinite}

/* ERROR: urgent shake (left/right) */
@keyframes shake{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-3px)}
  35%{transform:translateX(3px)}
  55%{transform:translateX(-2px)}
  75%{transform:translateX(2px)}
}
.agent-card[data-status="ERROR"] .pixel-char{animation:shake .5s ease-in-out infinite}

/* ── DESK ── */
.desk{
  width:56px;height:10px;background:var(--bg2);
  border:1px solid var(--border);border-radius:1px;margin-top:-4px;
  position:relative;
}
.desk::after{
  content:'';position:absolute;top:2px;left:8px;right:8px;height:3px;
  background:var(--border2);border-radius:1px;
}

/* ── MONITOR ── */
.desk-monitor{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  width:16px;height:12px;background:var(--bg3);border:1px solid var(--border);
  overflow:hidden;
}
.desk-monitor::before{
  /* stand */
  content:'';position:absolute;bottom:-4px;left:5px;width:6px;height:3px;
  background:var(--border);z-index:1;
}

/* monitor screen */
.monitor-screen{
  position:absolute;top:1px;left:1px;right:2px;bottom:1px;
  background:#08080f;
  transition:background .3s;
}

/* monitor power light (top-right corner of monitor frame) */
.monitor-light{
  position:absolute;top:1px;right:1px;
  width:2px;height:2px;border-radius:50%;
  background:var(--text3);
  transition:background .2s,box-shadow .2s;
}

/* ── MONITOR STATES ── */

/* IDLE: dark screen, no light */
.agent-card[data-status="IDLE"] .monitor-screen{background:#08080f}
.agent-card[data-status="IDLE"] .monitor-light{background:var(--text3);box-shadow:none}

/* RUNNING: green light + code-flickering screen */
.agent-card[data-status="RUNNING"] .monitor-light{
  background:#52b788;
  box-shadow:0 0 4px #52b788,0 0 8px rgba(82,183,136,.4);
}
@keyframes screen-code{
  0%  {background:#0d1f0d}
  25% {background:#08080f}
  50% {background:#0f2a0f}
  75% {background:#06100a}
  100%{background:#0d1f0d}
}
.agent-card[data-status="RUNNING"] .monitor-screen{
  animation:screen-code .35s steps(4) infinite;
}

/* DONE: blue light + bright screen */
.agent-card[data-status="DONE"] .monitor-light{
  background:#60a5fa;
  box-shadow:0 0 4px #60a5fa,0 0 8px rgba(96,165,250,.4);
}
.agent-card[data-status="DONE"] .monitor-screen{background:#0d1a2e}

/* ERROR: red light + red flickering screen */
.agent-card[data-status="ERROR"] .monitor-light{
  background:#f87171;
  box-shadow:0 0 4px #f87171,0 0 8px rgba(248,113,113,.4);
}
@keyframes screen-error{
  0%,100%{background:#2a0808}
  40%    {background:#08080f}
  70%    {background:#1a0404}
}
.agent-card[data-status="ERROR"] .monitor-screen{
  animation:screen-error .5s steps(3) infinite;
}

/* ── PROGRESS BAR ── */
.progress-wrap{
  align-self:stretch;
  height:3px;background:var(--bg);border-radius:2px;
  overflow:hidden;position:relative;
}
.progress-bar{
  height:100%;border-radius:2px;
  background:var(--idle-t);
  width:0%;
  transition:width .4s ease,background .3s;
}

/* IDLE: empty, stopped */
.agent-card[data-status="IDLE"] .progress-bar{
  width:0%;background:var(--idle-t);animation:none;
}

/* RUNNING: 40% bar bouncing left ↔ right */
@keyframes progress-bounce{
  from{margin-left:0%}
  to  {margin-left:60%}
}
.agent-card[data-status="RUNNING"] .progress-bar{
  width:40%;background:var(--running-t);
  animation:progress-bounce 1.4s ease-in-out infinite alternate;
  transition:none;
}

/* DONE: full width, green */
.agent-card[data-status="DONE"] .progress-bar{
  width:100%;background:var(--done-t);animation:none;
}

/* ERROR: full width, red */
.agent-card[data-status="ERROR"] .progress-bar{
  width:100%;background:var(--error-t);animation:none;
}

/* ── AGENT META ── */
.agent-name{font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase}
.agent-status{
  font-size:8px;letter-spacing:1px;padding:2px 6px;border-radius:1px;
  background:var(--status-bg, transparent);color:var(--status-fg, var(--idle-t));
}
.agent-card[data-status="RUNNING"] .agent-status{color:var(--running-t)}
.agent-card[data-status="DONE"] .agent-status{color:var(--done-t)}
.agent-card[data-status="ERROR"] .agent-status{color:var(--error-t)}
.agent-msg{
  font-size:7px;color:var(--text3);text-align:center;max-width:110px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4;
}

/* ── STATS BAR ── */
.stats-bar{
  display:flex;gap:16px;flex-wrap:wrap;
  padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border2);
}
.stat{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:1px}
.stat-dot{width:6px;height:6px;border-radius:50%}
.stat-dot.running{background:var(--running-t)}
.stat-dot.done{background:var(--done-t)}
.stat-dot.error{background:var(--error-t)}
.stat-dot.idle{background:var(--idle-t)}
.stat span{color:var(--text3)}
.stat strong{color:var(--text2)}

/* ── ACTIVITY LOG ── */
.log-section{
  max-width:960px;margin:0 auto 20px;padding:0 16px;
}
.log-title{
  font-size:9px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;
  margin-bottom:8px;display:flex;align-items:center;gap:8px;
}
.log-title::before{content:'';display:block;width:16px;height:1px;background:var(--text3)}
.log-list{
  background:var(--bg2);border:1px solid var(--border2);border-radius:4px;
  max-height:160px;overflow-y:auto;font-size:10px;
}
.log-item{
  display:flex;gap:10px;align-items:baseline;
  padding:6px 12px;border-bottom:1px solid var(--bg3);
}
.log-item:last-child{border-bottom:none}
.log-time{color:var(--text3);flex-shrink:0;font-size:9px}
.log-agent{
  flex-shrink:0;width:60px;color:var(--text2);
  font-size:9px;letter-spacing:1px;text-transform:uppercase;
}
.log-status{flex-shrink:0;width:52px;font-size:8px;letter-spacing:1px}
.log-status.RUNNING{color:var(--running-t)}
.log-status.DONE{color:var(--done-t)}
.log-status.ERROR{color:var(--error-t)}
.log-status.IDLE{color:var(--idle-t)}
.log-msg{color:var(--text3);font-size:9px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── MOBILE ── */
@media(max-width:600px){
  .office{grid-template-columns:1fr;grid-template-rows:auto}
  .team-room.support{grid-column:1}
  .agents-row{gap:8px}
  .agent-card{min-width:70px;padding:8px 6px}
}
</style>
</head>

function drawChar(canvasId, agent, status) {
  const canvas = document.getElementById('char-' + agent);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const pal = PALETTES[agent] || PALETTES.plan;
  const frame = FRAMES[status] || FRAMES.IDLE;
  const colors = ['transparent', pal.hair, pal.skin, pal.shirt, '#374151'];

  ctx.clearRect(0, 0, 12, 16);
  for (let r = 0; r < 16; r++) {
    for (let c = 0; c < 12; c++) {
      const v = frame[r][c];
      if (!v) continue;
      ctx.fillStyle = colors[v];
      ctx.fillRect(c, r, 1, 1);
    }
  }
}

function initChars() {
  Object.keys(PALETTES).forEach(agent => drawChar('char-' + agent, agent, 'IDLE'));
}

// ── STATE ────────────────────────────────────────────────────
let activityLog = [];

function updateAgent(agent, status, message) {
  const card = document.getElementById('agent-' + agent);
  if (!card) return;

  card.setAttribute('data-status', status);
  const statusEl = card.querySelector('.agent-status');
  const msgEl = card.querySelector('.agent-msg');
  if (statusEl) statusEl.textContent = status;
  if (msgEl) msgEl.textContent = message || '—';

  drawChar('char-' + agent, agent, status);
}

function updateStats(agents) {
  const counts = {RUNNING:0, DONE:0, ERROR:0, IDLE:0};
  Object.values(agents).forEach(a => {
    const s = a.status || 'IDLE';
    counts[s] = (counts[s] || 0) + 1;
  });
  document.getElementById('cnt-running').textContent = counts.RUNNING;
  document.getElementById('cnt-done').textContent    = counts.DONE;
  document.getElementById('cnt-error').textContent   = counts.ERROR;
  document.getElementById('cnt-idle').textContent    = counts.IDLE;
}

function addLog(agent, status, message, updatedAt) {
  const time = updatedAt ? updatedAt.substring(11,19) : new Date().toTimeString().substring(0,8);
  activityLog.unshift({time, agent, status, message});
  if (activityLog.length > 50) activityLog.pop();
  renderLog();
}

function renderLog() {
  const list = document.getElementById('log-list');
  list.innerHTML = activityLog.map(item =>
    `<div class="log-item">
      <span class="log-time">${item.time}</span>
      <span class="log-agent">${item.agent}</span>
      <span class="log-status ${item.status}">${item.status}</span>
      <span class="log-msg">${item.message || '—'}</span>
    </div>`
  ).join('');
}

// ── POLLING ──────────────────────────────────────────────────
let prevData = {};
let countdown = 30;

async function poll() {
  try {
    const resp = await fetch(POLL_URL, {cache:'no-store'});
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const agents = data.agents || {};

    Object.entries(agents).forEach(([agent, row]) => {
      const prev = prevData[agent];
      const status = row.status || 'IDLE';
      const message = row.message || '';
      updateAgent(agent, status, message);

      if (!prev || prev.status !== status || prev.updated_at !== row.updated_at) {
        addLog(agent, status, message, row.updated_at);
      }
    });

    updateStats(agents);
    prevData = agents;

    const now = new Date();
    document.getElementById('last-update').textContent =
      'UPDATED ' + now.toTimeString().substring(0,8);
  } catch(e) {
    console.warn('Poll error:', e.message);
  }
}

// ── COUNTDOWN ────────────────────────────────────────────────
function tick() {
  countdown--;
  if (countdown <= 0) {
    countdown = 30;
    poll();
  }
  document.getElementById('countdown').textContent = `REFRESH ${countdown}s`;
}

// ── INIT ─────────────────────────────────────────────────────
initChars();
poll();
setInterval(tick, 1000);
</script>
